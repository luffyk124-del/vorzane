name: Import generated VORZANE artwork

on:
  push:
    branches: [feature/vorzane-world-ui-overhaul]
    paths: [.github/workflows/import-vorzane-artwork.yml]

permissions:
  contents: write

jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vorzane-world-ui-overhaul
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download generated artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted-vorzane/VORZANE/public/images/avatars extracted-vorzane/VORZANE/public/images/characters/generated
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/9ac0e555-6091-46e2-b882-769c2df70466/0cb3e7bf-1e4f-4064-a782-74efddffac87/One_standalone_premium_2D_fantasy_RPG_profile_avatar_portrai.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzc3NTk1MGVjZDI2YTc1YiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDU0MTQ1NH0.WjoDFF0GUHxP6XTyTZABQ2a3Aem28W7uNSQG-S7dVmw' -o extracted-vorzane/VORZANE/public/images/avatars/avatar_01.jpg
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/55b8e641-c4e4-42cd-bd97-d4ab5b8f269d/06f70cc0-a72d-4a90-a3b1-d927775ce21e/One_standalone_premium_2D_fantasy_RPG_profile_avatar_portrai.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODllMTMyYjNiOTExMGZhYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDQ5MTU3MX0.zN3ojG3t0AwIq08z3zoRnakpOOPWV0x0AxDJZ1HFZ1k' -o extracted-vorzane/VORZANE/public/images/avatars/avatar_02.jpg
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/a404d944-b5ac-4313-9ee8-0a51d1f9fcc2/e8b81057-d32c-4903-9b2c-b094c188c04e/One_standalone_premium_2D_fantasy_RPG_profile_avatar_portrai.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTgxYTc3YzQ0N2IwYmUxNSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsImV4cCI6MTc5NDUyNjQwNH0.iMtIk4PvG11ckslUSjsSpozTqKyFostsIfkU0c5VT6s' -o extracted-vorzane/VORZANE/public/images/avatars/avatar_03.jpg
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/f9ff484b-3209-4fea-96b2-1e7e203307e1/a4642587-9ab5-4f14-84d9-5fa3f262a9b4/One_standalone_premium_2D_fantasy_RPG_profile_avatar_portrai.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzg1NjlmZDJhMTIyYzE5OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsImV4cCI6MTc5NDUxNTQxMH0.zKjQZdLjDEJWmPUKTcFN974OVYldAUQvR2DSyr6UH_U' -o extracted-vorzane/VORZANE/public/images/avatars/avatar_04.jpg
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/bf9484a1-e4ee-4afd-b66a-83b9c0ee3da6/50e8eb84-af2c-4d05-9ae5-7ca8ac135d1c/A_clean_professional_2D_fantasy_RPG_game_character_sprite_sh.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDIzYWY3MDE2OWE2ODM0MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDUwMDQ4MX0.EcWUh_Y3v3TU9rFdWoa2rGsV2xW6bJ8f2XZ8yxBhKAI' -o extracted-vorzane/VORZANE/public/images/characters/generated/hero_male_sheet.jpg
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/3e63e095-e96c-414a-9fe5-ad3527d69e0c/7e004424-afdd-4cda-bcdc-664155d28058/A_clean_professional_2D_fantasy_RPG_game_character_sprite_sh.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGZjM2FmODZiZDczMjQ3OSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDUwNTIyMn0.D43T1JTNiN011VRNI9vITxsau8EB7oyP5YrQjphuzZ0' -o extracted-vorzane/VORZANE/public/images/characters/generated/hero_female_sheet.jpg
          file extracted-vorzane/VORZANE/public/images/avatars/*
          file extracted-vorzane/VORZANE/public/images/characters/generated/*
      - name: Commit artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted-vorzane/VORZANE/public/images/avatars extracted-vorzane/VORZANE/public/images/characters/generated
          git commit -m "assets: add generated profile avatars and character sheets"
          git push origin HEAD:feature/vorzane-world-ui-overhaul
