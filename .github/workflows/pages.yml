name: Build and deploy VORZANE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "extracted-vorzane/VORZANE/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "extracted-vorzane/VORZANE/**"
  workflow_dispatch:
    inputs:
      approve_deploy:
        description: Approve publishing the verified dist artifact to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read


jobs:
  social-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vorzane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vorzane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Supabase auth test schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vorzane_test
        run: |
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          if [ -z "$PG_CONTAINER" ]; then
            echo 'PostgreSQL service container was not found' >&2
            exit 1
          fi
          psql() { docker exec -i "$PG_CONTAINER" psql "$@"; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $auth$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $auth$;
          CREATE FUNCTION auth.role() RETURNS text
          LANGUAGE sql STABLE
          AS $auth$
            SELECT nullif(current_setting('request.jwt.claim.role', true), '')
          $auth$;
          GRANT USAGE ON SCHEMA auth TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid(), auth.role() TO authenticated, service_role;
          SQL
      - name: Apply social migration and run database integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vorzane_test
        run: |
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          if [ -z "$PG_CONTAINER" ]; then
            echo 'PostgreSQL service container was not found' >&2
            exit 1
          fi
          psql() { docker exec -i "$PG_CONTAINER" psql "$@"; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/migrations/20261106075800_create_player_saves.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/migrations/20261106080400_restrict_player_save_privileges.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/migrations/20261108220000_player_saves_size_limit.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/migrations/20261108012451_create_player_social.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/migrations/20261108180000_create_player_notifications.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/migrations/20261110100000_public_player_profiles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/tests/player_social.integration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/tests/player_saves_rls.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/migrations/20261109090000_create_player_save_recovery.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/tests/player_save_recovery.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/migrations/20261112141314_create_player_command_receipts.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT SELECT ON public.player_saves TO service_role"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 < extracted-vorzane/VORZANE/supabase/tests/player_command_receipts.sql

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extracted-vorzane/VORZANE/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: extracted-vorzane/VORZANE
        run: pnpm install --frozen-lockfile
      - name: Test game systems
        working-directory: extracted-vorzane/VORZANE
        run: pnpm test
      - name: Install Playwright Chromium
        working-directory: extracted-vorzane/VORZANE
        run: pnpm exec playwright install chromium
      - name: Test desktop and mobile flows
        working-directory: extracted-vorzane/VORZANE
        run: pnpm run test:browser
      - name: Upload 2D character mobile preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vorzane-2d-character-mobile-preview
          path: /tmp/vorzane-profile-2d-mobile.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Typecheck
        working-directory: extracted-vorzane/VORZANE
        run: pnpm run typecheck
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Supabase Edge Functions
        working-directory: extracted-vorzane/VORZANE
        run: deno check supabase/functions/game-state/index.ts supabase/functions/game-state/index.test.ts supabase/functions/economy-command/index.ts supabase/functions/economy-command/index.test.ts supabase/functions/stage-save-recovery/index.ts supabase/functions/stage-save-recovery/index.test.ts
      - name: Test Supabase Edge Functions
        working-directory: extracted-vorzane/VORZANE
        run: deno test supabase/functions/game-state/index.test.ts supabase/functions/economy-command/index.test.ts supabase/functions/stage-save-recovery/index.test.ts
      - name: Build web export
        working-directory: extracted-vorzane/VORZANE
        env:
          EXPO_PUBLIC_BASE_PATH: /vorzane
        run: pnpm run build
      - name: Verify Pages export
        working-directory: extracted-vorzane/VORZANE
        env:
          EXPO_PUBLIC_BASE_PATH: /vorzane
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, stat } from 'node:fs/promises';
          import path from 'node:path';

          const output = path.resolve('dist');
          const basePath = process.env.EXPO_PUBLIC_BASE_PATH;
          const htmlFiles = [];
          const walk = async (directory) => {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) await walk(file);
              else if (entry.name.endsWith('.html')) htmlFiles.push(file);
            }
          };

          await walk(output);
          if (!htmlFiles.some((file) => file === path.join(output, 'index.html'))) {
            throw new Error('Missing dist/index.html');
          }

          const problems = [];
          for (const file of htmlFiles) {
            const html = await readFile(file, 'utf8');
            for (const [, url] of html.matchAll(/(?:src|href)=["']([^"']+)["']/g)) {
              if (!url.startsWith('/') || url.startsWith('//')) continue;
              if (!url.startsWith(`${basePath}/`)) {
                problems.push(`${path.relative(output, file)} references ${url} outside ${basePath}/`);
                continue;
              }
              const resourcePath = decodeURIComponent(url.slice(basePath.length + 1).split(/[?#]/, 1)[0]);
              const resource = path.resolve(output, resourcePath);
              if (!resource.startsWith(`${output}${path.sep}`)) {
                problems.push(`${path.relative(output, file)} references a path outside dist`);
                continue;
              }
              const candidates = [resource, `${resource}.html`, path.join(resource, 'index.html')];
              let exists = false;
              for (const candidate of candidates) {
                try {
                  if ((await stat(candidate)).isFile()) exists = true;
                } catch {}
              }
              if (!exists) problems.push(`${path.relative(output, file)} references missing ${url}`);
            }
          }

          if (problems.length) throw new Error(problems.join('\n'));
          console.log(`Verified ${htmlFiles.length} static HTML files and root-relative links under ${basePath}/`);

          const characterModels = [
            'vorzane-male-short.glb',
            'vorzane-male-fringe.glb',
            'vorzane-female-short.glb',
            'vorzane-female-braids.glb',
          ];
          for (const model of characterModels) {
            const modelPath = path.join(output, 'models', 'characters', model);
            const bytes = await readFile(modelPath);
            if (bytes.length < 20 || bytes.toString('ascii', 0, 4) !== 'glTF' || bytes.readUInt32LE(8) !== bytes.length) {
              throw new Error(`Missing or invalid generated character model: ${model}`);
            }
          }
          console.log(`Verified ${characterModels.length} generated character model variants.`);
          NODE
          if find dist -type f -name '.env*' -print -quit | grep -q .; then
            echo 'Unexpected environment file found in dist' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: extracted-vorzane/VORZANE/dist

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.approve_deploy)
    concurrency:
      group: github-pages
      cancel-in-progress: false
    needs: [build, social-db]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
