name: VORZANE social database tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/social-db.yml"
      - "extracted-vorzane/VORZANE/supabase/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/social-db.yml"
      - "extracted-vorzane/VORZANE/supabase/**"

permissions:
  contents: read

jobs:
  social-db:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vorzane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vorzane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated Supabase auth test schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vorzane_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, service_role;
          SQL
      - name: Apply additive migrations and test public social profiles and notifications
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vorzane_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f extracted-vorzane/VORZANE/supabase/migrations/20261106075800_create_player_saves.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f extracted-vorzane/VORZANE/supabase/migrations/20261106080400_restrict_player_save_privileges.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f extracted-vorzane/VORZANE/supabase/migrations/20261108012451_create_player_social.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f extracted-vorzane/VORZANE/supabase/migrations/20261108180000_create_player_notifications.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f extracted-vorzane/VORZANE/supabase/migrations/20261110100000_public_player_profiles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f extracted-vorzane/VORZANE/supabase/tests/player_social.integration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f extracted-vorzane/VORZANE/supabase/migrations/20261109090000_create_player_save_recovery.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f extracted-vorzane/VORZANE/supabase/tests/player_save_recovery.sql
          # Verify the database quota under simultaneous privileged inserts.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO auth.users (id) VALUES ('00000000-0000-0000-0000-00000000000d') ON CONFLICT (id) DO NOTHING"
          quota_dir="$(mktemp -d)"
          for i in $(seq 1 8); do
            recovery_key="$(printf '10000000-0000-4000-8000-0000000000%02d' "$i")"
            (
              if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SET ROLE service_role; INSERT INTO public.player_save_recovery (user_id, recovery_key, source, snapshot) VALUES ('00000000-0000-0000-0000-00000000000d', '$recovery_key', 'offline', '{}'::jsonb)" >"$quota_dir/$i.log" 2>&1; then
                echo success >"$quota_dir/$i.status"
              else
                echo rejected >"$quota_dir/$i.status"
              fi
            ) &
          done
          wait
          successes="$(grep -l success "$quota_dir"/*.status | wc -l)"
          rejected="$(grep -l rejected "$quota_dir"/*.status | wc -l)"
          actual_rows="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.player_save_recovery WHERE user_id = '00000000-0000-0000-0000-00000000000d'")"
          actual_counter="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT record_count FROM vorzane_internal.player_save_recovery_quotas WHERE user_id = '00000000-0000-0000-0000-00000000000d'")"
          if [ "$successes" -ne 5 ] || [ "$rejected" -ne 3 ] || [ "$actual_rows" -ne 5 ] || [ "$actual_counter" -ne 5 ]; then
            echo "Recovery quota concurrency test failed: successes=$successes rejected=$rejected rows=$actual_rows counter=$actual_counter"
            cat "$quota_dir"/*.log
            exit 1
          fi
