openapi: 3.1.0
info:
  title: VORZANE backend API
  version: 0.1.0
  description: REST is authoritative for persisted game state. Never submit a client-computed save or battle result.
servers:
  - url: https://{host}
    variables: {host: {default: api.example.invalid}}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: vz_session}
  schemas:
    Error: {type: object, properties: {error: {type: string}}, required: [error]}
    User: {type: object, properties: {id: {type: string, format: uuid}, email: {type: [string, 'null']}, isAnonymous: {type: boolean}, role: {type: string}}, required: [id,email,isAnonymous,role]}
    Command: {oneOf: [{type: object, required: [type,name,className], properties: {type: {const: createHero}, name: {type: string}, className: {enum: [Warrior,Mage,Assassin,Archer]}}}, {type: object, required: [type,mode], properties: {type: {const: startBattle}, mode: {enum: [cave,dungeon,tower,hard]}}}, {type: object, required: [type,questId], properties: {type: {const: claimQuest}, questId: {type: string}}}, {type: object, required: [type,itemId], properties: {type: {enum: [buyItem,sellItem,equipItem]}, itemId: {type: string}}}, {type: object, required: [type,slot], properties: {type: {const: unequipItem}, slot: {type: string}}}, {type: object, required: [type,petId], properties: {type: {enum: [buyPet,setPet]}, petId: {type: [string,'null']}}}, {type: object, required: [type,planId], properties: {type: {const: beginExpedition}, planId: {type: string}}}, {type: object, required: [type,settings], properties: {type: {const: updateSettings}, settings: {type: object}}}, {type: object, required: [type,avatarId], properties: {type: {const: setProfileAvatar}, avatarId: {type: string}}}, {type: object, required: [type,id], properties: {type: {const: dismissReport}, id: {type: string}}}]}
paths:
  /healthz:
    get: {security: [], responses: {'200': {description: Ready}, '503': {description: Not ready}}}
  /api/v1/auth/me:
    get: {security: [], responses: {'200': {description: User or null}}}
  /api/v1/auth/guest:
    post: {security: [], responses: {'200': {description: Guest session}, '503': {description: Database unavailable}}}
  /api/v1/auth/register:
    post: {security: [], responses: {'201': {description: Registered}, '400': {description: Invalid request}, '409': {description: Conflict}}}
  /api/v1/auth/login:
    post: {security: [], responses: {'200': {description: Authenticated}, '401': {description: Invalid credentials}}}
  /api/v1/auth/logout:
    post: {security: [sessionCookie], responses: {'200': {description: Logged out}}}
  /api/v1/game/state:
    get: {security: [sessionCookie], responses: {'200': {description: Authoritative state}, '401': {description: Unauthorized}}}
  /api/v1/game/command:
    post:
      security: [sessionCookie]
      parameters: [{in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Command'}}}}
      responses: {'200': {description: Command result}, '401': {description: Unauthorized}, '409': {description: Idempotency conflict}, '501': {description: Command not enabled}}
